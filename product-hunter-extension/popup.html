<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GLDN Product Hunter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" width="32" height="32" alt="">
    <div><strong>GLDN Product Hunter</strong><span id="version">Loading</span></div>
  </header>
  <main>
    <div class="status-line"><span>Run</span><strong id="run-status">Idle</strong></div>
    <div class="counts"><div><span>Ready</span><strong id="ready-count">0</strong></div><div><span>Review</span><strong id="review-count">0</strong></div><div><span>Blocked</span><strong id="blocked-count">0</strong></div></div>
    <p id="message">Open the full hunter to start or review a run.</p>
    <button id="open-dashboard" type="button">Open Product Hunter</button>
    <div class="actions"><button id="pause" type="button">Pause</button><button id="resume" type="button">Resume</button></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
